<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알림</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<dc-import name="Header" title="알림" back="Main.dc.html" hint-size="390px,56px"></dc-import>
<div style="padding: 4px 16px 8px; font-size: 13px; color: #6B6B73">오늘</div>
<sc-for list="{{today}}" as="n" hint-placeholder-count="3">
<a href="{{n.href}}" style="display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: {{n.bg}}">
<div style="width: 44px; height: 44px; border-radius: 50%; background: {{n.av}}; flex-shrink: 0"></div>
<div style="flex-grow: 1; font-size: 14px; line-height: 1.45"><b>{{n.who}}</b> {{n.what}}<div style="font-size: 12px; color: #6B6B73">{{n.when}}</div></div>
</a>
</sc-for>
<div style="padding: 16px 16px 8px; font-size: 13px; color: #6B6B73">이번 주</div>
<sc-for list="{{week}}" as="n" hint-placeholder-count="3">
<a href="{{n.href}}" style="display: flex; gap: 12px; align-items: center; padding: 12px 16px">
<div style="width: 44px; height: 44px; border-radius: 50%; background: {{n.av}}; flex-shrink: 0"></div>
<div style="flex-grow: 1; font-size: 14px; line-height: 1.45"><b>{{n.who}}</b> {{n.what}}<div style="font-size: 12px; color: #6B6B73">{{n.when}}</div></div>
</a>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
today: [
{ who: 'moonlit_draws', what: '님이 새 시리즈 「겨울 고양이」를 예고했어요', when: '2시간 전', av: '#B3AEEA', bg: '#F6F3FC', href: 'SellerPage.dc.html' },
{ who: '오늘의 무료 뽑기', what: '가 준비됐어요. 조각 1개를 받아가세요', when: '9시간 전', av: '#F2C94C', bg: '#F6F3FC', href: 'Detail.dc.html' },
{ who: '배송', what: '숲속 우체국 아트 프린트가 출발했어요', when: '11시간 전', av: '#C6D8A9', bg: '#ffffff', href: 'Orders.dc.html' }
],
week: [
{ who: 'sea_mint', what: '님의 「새벽 바다」 마감까지 3일 남았어요', when: '2일 전', av: '#9CCBD3', href: 'Detail.dc.html' },
{ who: '교환소', what: '에서 누가 내 중복 조각을 원해요', when: '4일 전', av: '#D7D3F2', href: 'Exchange.dc.html' },
{ who: '축하해요!', what: '숲속 우체국 시리즈를 완성했어요', when: '6일 전', av: '#141414', href: 'Reward.dc.html' }
]
};
}
}
</script>
</body>
</html>

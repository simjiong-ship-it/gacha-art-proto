<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로필 편집</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414; position: relative">
<dc-import name="Header" title="프로필 편집" back="My.dc.html" hint-size="390px,56px"></dc-import>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0 20px">
<sc-if value="{{avatar}}" hint-placeholder-val="{{false}}"><img src="{{avatar}}" alt="" style="width: 96px; height: 96px; border-radius: 50%; object-fit: cover"></sc-if>
<sc-if value="{{noAvatar}}" hint-placeholder-val="{{true}}"><div style="width: 96px; height: 96px; border-radius: 50%; background: #D7D3F2"></div></sc-if>
<div style="font-size: 12px; color: #6B6B73">{{accountLine}}</div>
</div>
<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6B6B73">닉네임<input id="pe-name" value="{{nick}}" maxlength="20" style="height: 46px; border-radius: 12px; border: 1px solid #DDDBE2; padding: 0 14px; font-size: 15px; color: #141414"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6B6B73">소개<textarea id="pe-bio" maxlength="80" placeholder="한 줄 소개를 적어주세요" style="height: 90px; border-radius: 12px; border: 1px solid #DDDBE2; padding: 12px 14px; font-size: 15px; color: #141414; resize: none">{{bio}}</textarea></label>
</div>
<div style="flex-grow: 1"></div>
<div style="padding: 0 16px 24px">
<button onClick="{{save}}" style="width: 100%; height: 54px; border-radius: 14px; border: 0; background: #141414; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">저장</button>
</div>
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); padding: 10px 16px; border-radius: 20px; background: #141414; color: #ffffff; font-size: 13px; white-space: nowrap">{{toast}}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { toast: '' }; }
renderVals() {
var self = this;
var A = window.GA && window.GA.signedIn ? window.GA : null;
function flash(m) { self.setState({ toast: m }); clearTimeout(self._t); self._t = setTimeout(function () { self.setState({ toast: '' }); }, 1600); }
var av = A && A.me && A.me.avatarUrl ? A.me.avatarUrl : '';
return {
toast: this.state.toast, avatar: av, noAvatar: !av,
nick: A ? (A.prof.nickname || (A.me && A.me.name) || '') : '로이',
bio: A ? (A.prof.bio || '') : '',
accountLine: A ? ((A.me && A.me.name ? A.me.name + ' 계정' : '내 계정') + '에 저장돼요') : '예시 화면이에요',
save: function () {
var n = document.getElementById('pe-name'), b = document.getElementById('pe-bio');
var patch = { nickname: n ? n.value.trim().slice(0, 20) : '', bio: b ? b.value.trim().slice(0, 80) : '' };
if (!A) { flash('저장했어요'); return; }
A.save(patch).then(function (ok) { flash(ok ? '저장했어요' : '저장하지 못했어요. 잠시 후 다시 눌러주세요'); });
}
};
}
}
</script>
</body>
</html>

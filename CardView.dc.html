<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카드 보기</title>
<script src="./support.js"></script>
<script src="./catalog.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Caveat:wght@600&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; background: #F6F5F8; display: flex; flex-direction: column; align-items: center; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<dc-import name="Header" title="밤의 고양이 · 004/010" back="My.dc.html" hint-size="390px,56px"></dc-import>
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<button onClick="{{tilt}}" aria-label="카드 기울이기" style="border: 0; background: transparent; padding: 0; cursor: pointer">
<div style="width: 270px; height: 378px; border-radius: 18px; box-sizing: border-box; border: 7px solid #8A4FD1; background: #ffffff; padding: 9px; display: flex; flex-direction: column; gap: 8px; transform: {{tf}}; transition: transform .4s; box-shadow: 0 20px 44px rgba(20, 20, 20, 0.18); position: relative; overflow: hidden">
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #45454C"><span>004/010</span><span>No.37</span></div>
<div style="flex-grow: 1; border-radius: 9px; overflow: hidden">
<dc-import name="Art" sid="night" vb="602 0 100 130" hint-size="100%,100%"></dc-import>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="font-size: 14px; font-weight: 600">잠 못 드는 고양이</div>
<div style="font-family: 'Caveat', cursive; font-size: 22px; color: #45454C; line-height: 1">moonlit</div>
</div>
<div style="position: absolute; top: -40px; left: {{shine}}px; width: 56px; height: 480px; background: rgba(255, 255, 255, 0.3); transform: rotate(24deg); transition: left .4s"></div>
</div>
</button>
</div>
<div style="font-size: 12px; color: #6B6B73; padding-bottom: 12px">카드를 누르면 빛이 움직여요</div>
<div style="width: 100%; box-sizing: border-box; padding: 0 16px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="Exchange.dc.html" style="height: 52px; border-radius: 14px; border: 1px solid #DDDBE2; background: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">교환소에 올리기</a>
<a href="GachaWide.dc.html" style="height: 52px; border-radius: 14px; background: #141414; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">시리즈에서 보기</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { t: 0 }; }
renderVals() {
var self = this, t = this.state.t % 3;
var tfs = ['perspective(800px) rotateY(-8deg) rotateX(4deg)', 'perspective(800px) rotateY(10deg) rotateX(-3deg)', 'perspective(800px) rotateY(0deg) rotateX(0deg)'];
return { tf: tfs[t], shine: [40, 190, -120][t], tilt: function () { self.setState({ t: self.state.t + 1 }); } };
}
}
</script>
</body>
</html>

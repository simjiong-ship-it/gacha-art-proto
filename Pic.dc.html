<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카드 그림</title>
<script src="./support.js"></script>
<script src="./catalog.js"></script>
<script src="./cards.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes gif-bob{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-2.6px) scale(1.012,.988)}60%{transform:translateY(-2.6px) scale(.992,1.01)}}
@keyframes gif-float{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-3.5px) rotate(-1.6deg)}75%{transform:translateY(-3.5px) rotate(1.6deg)}}
@keyframes gif-drift{0%{transform:scale(1.06) translate(0,0)}100%{transform:scale(1.06) translate(-2.2px,1.2px)}}
@keyframes gif-twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.gif-bob{animation:gif-bob 1.8s ease-in-out infinite;transform-origin:50px 112px}
.gif-float{animation:gif-float 2.6s ease-in-out infinite;transform-origin:50px 112px}
.gif-drift{animation:gif-drift 5s ease-in-out infinite alternate;transform-origin:50px 65px}
.twk{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;pointer-events:none;background:radial-gradient(circle,#fff 0 30%,rgba(255,255,255,0) 70%);animation:gif-twinkle 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.gif-bob,.gif-float,.gif-drift,.twk{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100%; overflow: hidden">
<svg width="100%" height="100%" viewBox="0 0 100 130" preserveAspectRatio="xMidYMid slice" style="display: block; width: 100%; height: 100%">
<defs>
<linearGradient id="ga-r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2A5C"></stop><stop offset=".55" stop-color="#2B3F9A"></stop><stop offset="1" stop-color="#4FB3D9"></stop></linearGradient>
<linearGradient id="ga-e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A0F3E"></stop><stop offset=".6" stop-color="#6A1E5E"></stop><stop offset="1" stop-color="#D98A1E"></stop></linearGradient>
<linearGradient id="ga-l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1446"></stop><stop offset=".45" stop-color="#6A2E9A"></stop><stop offset=".8" stop-color="#E36BD8"></stop><stop offset="1" stop-color="#FFD36B"></stop></linearGradient>
<filter id="ga-grain"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="4"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<radialGradient id="ga-gx" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#B9A6FF"></stop><stop offset=".45" stop-color="#6A5CFF"></stop><stop offset=".8" stop-color="#3B2A7A"></stop><stop offset="1" stop-color="#1B1446"></stop></radialGradient>
</defs>
<sc-if value="{{art}}" hint-placeholder-val="{{false}}"><image href="{{art}}" x="0" y="0" width="100" height="130" preserveAspectRatio="xMidYMid slice"></image></sc-if>
<g class="{{bgCls}}"><sc-for list="{{bgPaths}}" as="p" hint-placeholder-count="20">
<sc-if value="{{p.img}}" hint-placeholder-val="{{false}}"><image href="{{p.img}}" x="{{p.x}}" y="{{p.y}}" width="{{p.w}}" height="{{p.h}}" preserveAspectRatio="none"></image></sc-if>
<sc-if value="{{p.d}}" hint-placeholder-val="{{true}}"><path d="{{p.d}}" fill="{{p.f}}" opacity="{{p.o}}" stroke="{{p.s}}" stroke-width="{{p.w}}" stroke-linecap="round" stroke-linejoin="round" transform="{{p.t}}"></path></sc-if>
</sc-for></g>
<g class="{{figCls}}"><sc-for list="{{figPaths}}" as="p" hint-placeholder-count="20">
<sc-if value="{{p.img}}" hint-placeholder-val="{{false}}"><image href="{{p.img}}" x="{{p.x}}" y="{{p.y}}" width="{{p.w}}" height="{{p.h}}" preserveAspectRatio="none"></image></sc-if>
<sc-if value="{{p.d}}" hint-placeholder-val="{{true}}"><path d="{{p.d}}" fill="{{p.f}}" opacity="{{p.o}}" stroke="{{p.s}}" stroke-width="{{p.w}}" stroke-linecap="round" stroke-linejoin="round" transform="{{p.t}}"></path></sc-if>
</sc-for></g>
<sc-for list="{{fgPaths}}" as="p" hint-placeholder-count="20">
<sc-if value="{{p.img}}" hint-placeholder-val="{{false}}"><image href="{{p.img}}" x="{{p.x}}" y="{{p.y}}" width="{{p.w}}" height="{{p.h}}" preserveAspectRatio="none"></image></sc-if>
<sc-if value="{{p.d}}" hint-placeholder-val="{{true}}"><path d="{{p.d}}" fill="{{p.f}}" opacity="{{p.o}}" stroke="{{p.s}}" stroke-width="{{p.w}}" stroke-linecap="round" stroke-linejoin="round" transform="{{p.t}}"></path></sc-if>
</sc-for>
<sc-if value="{{grain}}" hint-placeholder-val="{{false}}"><rect width="100" height="130" filter="url(#ga-grain)" opacity=".3" style="mix-blend-mode: multiply"></rect></sc-if>
</svg>
<sc-if value="{{shine}}" hint-placeholder-val="{{false}}">
<sc-for list="{{twinkles}}" as="t" hint-placeholder-count="4">
<div class="twk" style="left: {{t.x}}%; top: {{t.y}}%; animation-delay: {{t.d}}s"></div>
</sc-for>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sid":{"editor":"text","default":"night"},"n":{"editor":"int","default":0,"min":0,"max":49},"gray":{"editor":"boolean","default":false},"flat":{"editor":"boolean","default":false},"$preview":{"width":200,"height":260}}'>
class Component extends DCLogic {
renderVals() {
var C = window.GCARD, G = window.GACHA;
var n = parseInt(this.props.n, 10) || 0;
if (!C || !G) return { bgPaths: [], figPaths: [], fgPaths: [], bgCls: '', figCls: '', shine: false, twinkles: [] };
var s = G.get(this.props.sid || 'night'), g = C.grade(n), gray = !!this.props.gray;
var shine = !gray && !this.props.flat && (g === 'R' || g === 'E' || g === 'L');
var tw = [];
if (shine) { var k = g === 'L' ? 7 : g === 'E' ? 5 : 3; for (var i = 0; i < k; i++) tw.push({ x: (13 + i * 37) % 90 + 5, y: (11 + i * 29) % 80 + 6, d: (i * 0.37).toFixed(2) }); }
var art = s.images && s.images.ready && !gray ? s.images.base + ('0' + (n + 1)).slice(-2) + s.images.ext : '';
var all = art ? [] : C.draw(s, n, gray);
var moving = shine;
return { bgPaths: all.filter(function (x) { return x.l === 0; }), figPaths: all.filter(function (x) { return x.l === 1; }), fgPaths: all.filter(function (x) { return x.l === 2; }),
bgCls: moving ? 'gif-drift' : '', figCls: moving ? (g === 'R' ? 'gif-bob' : 'gif-float') : '', art: art, grain: !art && s.style === 'meadow' && !gray, shine: shine, holoCls: g === 'L' ? 'holo holo-l' : g === 'E' ? 'holo holo-e' : 'holo', twinkles: tw };
}
}
</script>
</body>
</html>

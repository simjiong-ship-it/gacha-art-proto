<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>결제 내역</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<dc-import name="Header" title="결제 내역" back="MyMenu.dc.html" hint-size="390px,56px"></dc-import>
<div style="margin: 4px 16px 12px; padding: 16px; border-radius: 16px; background: #F6F5F8; display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 13px; color: #6B6B73">9월 사용 골드</div>
<div style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">33,000 골드</div>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #F0EEF3">
<div style="flex-grow: 1">
<div style="font-size: 15px">{{r.t}}</div>
<div style="font-size: 12px; color: #6B6B73">{{r.d}}</div>
</div>
<div style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{r.c}}">{{r.p}}</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { rows: [
{ t: '밤의 고양이 · 10회 뽑기', d: '9월 27일 18:40 · 골드 사용', p: '30,000 골드', c: '#141414' },
{ t: '밤의 고양이 · 1회 뽑기', d: '9월 27일 18:31 · 골드 사용', p: '3,000 골드', c: '#141414' },
{ t: '밤의 고양이 키링', d: '9월 25일 · 간편 결제', p: '12,000원', c: '#141414' },
{ t: '오늘의 무료 뽑기', d: '9월 24일', p: '0 골드', c: '#6B6B73' },
{ t: '새벽 바다 · 1회 뽑기', d: '9월 20일 · 환불', p: '−2,500 골드', c: '#B8404F' }
] };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{text-decoration:none}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414; padding: 0 24px 32px">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
<div style="display: flex; gap: 4px">
<div style="width: 44px; height: 60px; border-radius: 8px; background: #26215C"></div>
<div style="width: 44px; height: 60px; border-radius: 8px; background: #4B3FB0"></div>
<div style="width: 44px; height: 60px; border-radius: 8px; background: #E6E5EA"></div>
</div>
<div style="font-size: 32px; font-weight: 700; letter-spacing: -0.5px">Gacha art</div>
<div style="font-size: 15px; color: #45454C; text-align: center; line-height: 1.6">좋아하는 작가의 그림을<br>한 조각씩 모아보세요</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{live}}" hint-placeholder-val="{{false}}">
<a href="My.dc.html" style="min-height: 64px; border-radius: 16px; border: 2px solid #141414; padding: 0 14px; display: flex; align-items: center; gap: 12px; color: #141414">
<img src="{{avatar}}" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover">
<div style="flex-grow: 1"><div style="font-size: 15px; font-weight: 700">{{name}}(으)로 계속하기</div><div style="font-size: 12px; color: #6B6B73">이 계정의 마이페이지가 열려요</div></div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg>
</a>
<div style="font-size: 12px; color: #6B6B73; text-align: center; padding: 2px 0 6px">다른 계정은 claude.ai에서 계정을 바꾼 뒤 열면 따로 저장돼요</div>
</sc-if>
<a href="Main.dc.html" style="height: 54px; border-radius: 14px; background: #FEE500; color: #191600; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">카카오로 시작하기</a>
<a href="Main.dc.html" style="height: 54px; border-radius: 14px; background: #141414; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Apple로 시작하기</a>
<a href="Main.dc.html" style="height: 54px; border-radius: 14px; border: 1px solid #DDDBE2; color: #141414; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">이메일로 시작하기</a>
<a href="Main.dc.html" style="height: 44px; color: #6B6B73; display: flex; align-items: center; justify-content: center; font-size: 14px">둘러보기</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var A = window.GA && window.GA.signedIn ? window.GA : null;
return { live: !!A, name: A ? (A.displayName() || '내 계정') : '', avatar: A && A.me ? A.me.avatarUrl : '' };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뽑기 연출</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#0E0C1A;color:#ffffff}
a{color:#ffffff;text-decoration:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes rise{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translateY(-260px) scale(1);opacity:0}}
@keyframes wobble{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-3deg) translateY(-4px)}40%{transform:rotate(3deg) translateY(-8px)}60%{transform:rotate(-2deg) translateY(-4px)}80%{transform:rotate(2deg)}}
@keyframes glow{0%{border-color:#C9C8CF;box-shadow:0 0 30px rgba(201,200,207,.5)}25%{border-color:#5FA36A;box-shadow:0 0 40px rgba(95,163,106,.6)}50%{border-color:#3E7BD6;box-shadow:0 0 50px rgba(62,123,214,.7)}75%,100%{border-color:#A56BF0;box-shadow:0 0 80px rgba(165,107,240,.9),0 0 160px rgba(165,107,240,.45)}}
@keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
@keyframes flip{0%{transform:perspective(800px) rotateY(0) scale(1)}50%{transform:perspective(800px) rotateY(90deg) scale(1.15)}100%{transform:perspective(800px) rotateY(0) scale(1.08)}}
@keyframes burst{0%{transform:rotate(var(--r)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--r)) translateY(-190px) scale(.2);opacity:0}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
@keyframes fadeup{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
.rays{animation:spin 9s linear infinite}
.ring{animation:ring 2.2s ease-out infinite}
.ring2{animation:ring 2.2s ease-out 1.1s infinite}
.spark{animation:rise 3s ease-in infinite}
.card{animation:wobble 1.6s ease-in-out infinite,glow 3s ease-in forwards}
.hint{animation:blink 1.4s ease-in-out infinite}
.flash{animation:flash .7s ease-out forwards;pointer-events:none}
.shake{animation:shake .45s ease-in-out 2}
.flip{animation:flip .7s ease-out forwards;border-color:#A56BF0 !important;box-shadow:0 0 90px rgba(165,107,240,.95),0 0 180px rgba(165,107,240,.5)}
.back{background:repeating-linear-gradient(45deg,rgba(165,107,240,.08) 0 6px,transparent 6px 12px)}
.bit{animation:burst 1s ease-out forwards}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) .35s both}
.up{animation:fadeup .5s ease-out .8s both}
</style>
</helmet>
<div class="{{shakeCls}}" style="width: 100%; height: 100%; box-sizing: border-box; background: #0E0C1A; display: flex; flex-direction: column; align-items: center; font-family: 'IBM Plex Sans KR', sans-serif; color: #ffffff; position: relative; overflow: hidden">
<header style="width: 100%; height: 56px; padding: 0 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 3">
<div style="font-size: 13px; color: #A9A6BE">밤의 고양이 · 1 / 10</div>
<a href="Result.dc.html" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #3A3654; display: flex; align-items: center; font-size: 13px; color: #D8D6E6">건너뛰기</a>
</header>
<div style="flex-grow: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; position: relative">
<div style="width: 340px; height: 340px; position: relative; display: flex; align-items: center; justify-content: center">
<div class="rays" style="position: absolute; left: -60px; top: -60px; width: 460px; height: 460px; border-radius: 50%; background: repeating-conic-gradient(rgba(165, 107, 240, 0.22) 0deg 7deg, transparent 7deg 22deg); opacity: {{rayOp}}"></div>
<div class="ring" style="position: absolute; width: 300px; height: 300px; border-radius: 50%; border: 2px solid rgba(165, 107, 240, 0.7)"></div>
<div class="ring2" style="position: absolute; width: 300px; height: 300px; border-radius: 50%; border: 2px solid rgba(165, 107, 240, 0.7)"></div>
<sc-for list="{{sparks}}" as="s" hint-placeholder-count="16">
<div class="spark" style="position: absolute; left: {{s.x}}px; bottom: 20px; width: {{s.size}}px; height: {{s.size}}px; border-radius: 50%; background: {{s.c}}; box-shadow: 0 0 10px {{s.c}}; animation-delay: {{s.d}}s"></div>
</sc-for>
<sc-if value="{{opened}}" hint-placeholder-val="{{false}}">
<sc-for list="{{bits}}" as="b" hint-placeholder-count="18">
<div class="bit" style="position: absolute; left: 166px; top: 166px; width: 8px; height: 8px; border-radius: 2px; background: {{b.c}}; --r: {{b.r}}deg"></div>
</sc-for>
</sc-if>
<button onClick="{{open}}" aria-label="카드 열기" class="{{cardCls}}" style="width: 160px; height: 222px; border-radius: 16px; background: #1C1834; border: 4px solid #A56BF0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; padding: 0; overflow: hidden">
<div class="back" style="width: 128px; height: 190px; border-radius: 10px; border: 1px solid #4A4278; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
<svg width="58" height="58" viewBox="0 0 24 24" fill="#E2D2FF"><path d="M12 2.5c.6 4.6 2.9 6.9 7.5 7.5-4.6.6-6.9 2.9-7.5 7.5-.6-4.6-2.9-6.9-7.5-7.5 4.6-.6 6.9-2.9 7.5-7.5z"></path><path d="M19 15.5c.25 1.9 1.1 2.75 3 3-1.9.25-2.75 1.1-3 3-.25-1.9-1.1-2.75-3-3 1.9-.25 2.75-1.1 3-3z" opacity=".7"></path></svg>
<div style="font-size: 10px; font-weight: 700; letter-spacing: 3px; color: #A99BD8">GACHA ART</div>
</div>
</button>
</div>
<sc-if value="{{closed}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="font-size: 24px; font-weight: 700">뭔가 반짝여요…</div>
<div class="hint" style="font-size: 14px; color: #CFC6F2">카드를 눌러 열어보세요</div>
</div>
</sc-if>
<sc-if value="{{opened}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<div class="pop" style="font-size: 44px; font-weight: 700; letter-spacing: 4px; color: #C69BFF; text-shadow: 0 0 24px rgba(165, 107, 240, 0.9)">EPIC!</div>
<a href="Result.dc.html" class="up" style="height: 50px; padding: 0 28px; border-radius: 25px; background: #ffffff; color: #141414; display: flex; align-items: center; font-size: 15px; font-weight: 700">카드 확인하기</a>
</div>
</sc-if>
</div>
<div style="padding-bottom: 28px; font-size: 12px; color: #8F8AAE">빛 색깔이 바뀌다 멈추는 색 = 등급</div>
<sc-if value="{{opened}}" hint-placeholder-val="{{false}}">
<div class="flash" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #ffffff; z-index: 5"></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { opened: false }; }
renderVals() {
var self = this;
var o = this.state.opened;
var cols = ['#C69BFF', '#F2C94C', '#ffffff', '#8FB8FF'];
var sparks = [];
for (var i = 0; i < 16; i++) sparks.push({ x: 20 + (i * 53) % 300, size: 3 + (i % 3) * 2, d: ((i * 0.37) % 3).toFixed(2), c: cols[i % 4] });
var bits = [];
for (var j = 0; j < 18; j++) bits.push({ r: j * 20, c: cols[j % 4] });
return {
opened: o, closed: !o, sparks: sparks, bits: bits,
cardCls: o ? 'flip' : 'card', shakeCls: o ? 'shake' : '', rayOp: o ? 1 : 0.6,
open: function () { if (!self.state.opened) { self.setState({ opened: true }); if (window.GA && window.GA.signedIn) window.GA.addPulls([{ s: 'night', i: 3, g: 'E' }]); } }
};
}
}
</script>
</body>
</html>

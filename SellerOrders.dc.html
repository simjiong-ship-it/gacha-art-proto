<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주문 관리</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<dc-import name="Header" title="주문 · 배송 관리" back="SellerCenter.dc.html" hint-size="390px,56px"></dc-import>
<div style="padding: 4px 16px 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="padding: 12px; border-radius: 12px; background: #FCEEF3"><div style="font-size: 12px; color: #8A2F52">새 주문</div><div style="font-size: 20px; font-weight: 700">{{newCount}}</div></div>
<div style="padding: 12px; border-radius: 12px; background: #F6F5F8"><div style="font-size: 12px; color: #6B6B73">제작 중</div><div style="font-size: 20px; font-weight: 700">{{making}}</div></div>
<div style="padding: 12px; border-radius: 12px; background: #F6F5F8"><div style="font-size: 12px; color: #6B6B73">보냄</div><div style="font-size: 20px; font-weight: 700">{{sent}}</div></div>
</div>
<sc-for list="{{orders}}" as="o" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #F0EEF3">
<div style="width: 44px; height: 44px; border-radius: 10px; background: {{o.color}}; flex-shrink: 0"></div>
<div style="flex-grow: 1">
<div style="font-size: 14px; font-weight: 600">{{o.item}}</div>
<div style="font-size: 12px; color: #6B6B73">{{o.who}} · {{o.when}}</div>
</div>
<button onClick="{{o.next}}" style="height: 34px; padding: 0 12px; border-radius: 10px; border: {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap">{{o.action}}</button>
</div>
</sc-for>
<div style="padding: 14px 16px; font-size: 12px; color: #6B6B73; line-height: 1.6">제작·배송 대행을 켠 보상은 Gacha art가 대신 만들어 보내요</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { st: [0, 0, 1, 2] }; }
renderVals() {
var self = this, st = this.state.st;
var acts = [['제작 시작', '#141414', '#ffffff', '0'], ['송장 입력', '#ffffff', '#141414', '1px solid #DDDBE2'], ['보냄', '#F0EEF3', '#6B6B73', '0']];
var list = [['아트 프린트 · 밤의 고양이', 'luna_k', '10분 전', '#4B3FB0'], ['아크릴 키링 · 밤의 고양이', 'catlover', '1시간 전', '#5A4BC4'], ['아트 프린트 · 밤의 고양이', 'jiwoo', '어제', '#342A86'], ['원화 추첨 당첨', 'roi_collects', '3일 전', '#26215C']];
var orders = list.map(function (x, i) {
var a = acts[st[i]];
return { item: x[0], who: x[1], when: x[2], color: x[3], action: a[0], bg: a[1], fg: a[2], border: a[3],
next: function () { var s = self.state.st.slice(); if (s[i] < 2) s[i]++; self.setState({ st: s }); } };
});
function count(n) { return st.filter(function (v) { return v === n; }).length; }
return { orders: orders, newCount: count(0), making: count(1), sent: count(2) };
}
}
</script>
</body>
</html>

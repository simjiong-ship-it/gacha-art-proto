<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정산</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<dc-import name="Header" title="정산" back="SellerCenter.dc.html" hint-size="390px,56px"></dc-import>
<div style="margin: 4px 16px 0; padding: 18px; border-radius: 16px; background: #141414; color: #ffffff; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; color: #C9C7D0">10월 5일 받을 금액</div>
<div style="font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums">[금액]원</div>
<div style="font-size: 12px; color: #C9C7D0">[은행] · 끝자리 [0000]</div>
</div>
<div style="padding: 20px 16px 8px; font-size: 14px; font-weight: 600">주간 뽑기 수</div>
<div style="padding: 0 16px; display: flex; align-items: flex-end; gap: 8px; height: 120px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="font-size: 10px; color: #6B6B73; font-variant-numeric: tabular-nums">{{b.v}}</div>
<div style="width: 100%; height: {{b.h}}px; border-radius: 6px 6px 2px 2px; background: {{b.c}}"></div>
<div style="font-size: 11px; color: #6B6B73">{{b.d}}</div>
</div>
</sc-for>
</div>
<div style="padding: 22px 16px 8px; font-size: 14px; font-weight: 600">정산 내역</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #F0EEF3; font-size: 14px"><span>{{r.d}}</span><span style="color: #6B6B73">{{r.s}}</span></div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var v = [38, 42, 51, 44, 60, 72, 35], d = ['월', '화', '수', '목', '금', '토', '일'];
return {
bars: v.map(function (x, i) { return { v: x, d: d[i], h: Math.round(x / 72 * 76), c: i === 5 ? '#141414' : '#CFCBE0' }; }),
rows: [{ d: '9월 28일', s: '입금 예정' }, { d: '9월 21일', s: '입금 완료' }, { d: '9월 14일', s: '입금 완료' }]
};
}
}
</script>
</body>
</html>

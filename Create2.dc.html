<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>판매 등록 2단계</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<header style="height: 56px; padding: 0 8px; display: flex; align-items: center; flex-shrink: 0">
<a href="Create1.dc.html" aria-label="이전 단계" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<div style="flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">가격 · 등급</div>
<div style="width: 44px; text-align: center; font-size: 13px; color: #6B6B73">2 / 4</div>
</header>
<div style="height: 3px; background: #F0EEF3; margin: 0 16px; flex-shrink: 0"><div style="width: 50%; height: 3px; background: #141414"></div></div>
<div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 600">1회 뽑기 가격</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{prices}}" as="p" hint-placeholder-count="4">
<button onClick="{{p.pick}}" style="height: 44px; border-radius: 12px; border: {{p.border}}; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600; color: #141414; cursor: pointer">{{p.t}}</button>
</sc-for>
</div>
<div style="font-size: 12px; color: #6B6B73">10회 뽑기는 {{ten}} · 마지막 장 Rare 이상 확정</div>
</div>
<div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 14px; font-weight: 600">그림별 등급</div><div style="font-size: 12px; color: #6B6B73">누를 때마다 등급이 바뀌어요</div></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="10">
<button onClick="{{c.cycle}}" aria-label="{{c.aria}}" style="height: 84px; border-radius: 8px; border: {{c.bw}}px solid {{c.line}}; background: {{c.bg}}; padding: 0; position: relative; cursor: pointer">
<div style="position: absolute; left: 4px; right: 4px; bottom: 4px; height: 18px; border-radius: 6px; background: {{c.line}}; color: #ffffff; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Sans KR', sans-serif">{{c.g}}</div>
</button>
</sc-for>
</div>
<div style="padding: 12px; border-radius: 12px; background: #F6F5F8; font-size: 13px; color: #45454C; line-height: 1.6">자동 계산 확률 · {{summary}}</div>
</div>
<div style="padding: 18px 16px 0">
<button onClick="{{toggleFree}}" style="width: 100%; min-height: 56px; border-radius: 14px; border: 1px solid #E6E4EA; background: #ffffff; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-family: inherit; color: #141414; cursor: pointer">
<div style="text-align: left"><div style="font-size: 14px; font-weight: 600">매일 무료 조각 1개</div><div style="font-size: 12px; color: #6B6B73">처음 오는 팬이 부담 없이 시작해요</div></div>
<div style="width: 46px; height: 28px; border-radius: 14px; background: {{swBg}}; position: relative"><div style="position: absolute; top: 3px; left: {{swX}}px; width: 22px; height: 22px; border-radius: 50%; background: #ffffff"></div></div>
</button>
</div>
<div style="flex-grow: 1"></div>
<div style="padding: 12px 16px 20px; border-top: 1px solid #F0EEF3; display: flex; justify-content: flex-end">
<a href="Create3.dc.html" style="height: 44px; padding: 0 24px; border-radius: 12px; background: #141414; color: #ffffff; display: flex; align-items: center; font-size: 15px; font-weight: 600">다음</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { price: 2, g: ['C', 'C', 'C', 'U', 'C', 'U', 'R', 'R', 'E', 'L'], free: true }; }
renderVals() {
var self = this, s = this.state;
var G = { C: ['#A9A8B2', 1], U: ['#5FA36A', 2], R: ['#3E7BD6', 2], E: ['#8A4FD1', 3], L: ['#D98A1E', 3] };
var order = ['C', 'U', 'R', 'E', 'L'];
var weight = { C: 50, U: 25, R: 15, E: 8, L: 2 };
var bgs = ['#C7C3E6', '#BDB6E2', '#B1A8DC', '#A69AD6', '#9A8BCF', '#8E7DC8', '#826FC1', '#7661BA', '#6A53B3', '#5E45AC'];
var prices = [2000, 2500, 3000, 3500];
var cards = s.g.map(function (g, i) {
return { g: g, bg: bgs[i], line: G[g][0], bw: G[g][1], aria: (i + 1) + '번 그림 등급 ' + g,
cycle: function () { var a = self.state.g.slice(); a[i] = order[(order.indexOf(a[i]) + 1) % 5]; self.setState({ g: a }); } };
});
var counts = {}; s.g.forEach(function (g) { counts[g] = (counts[g] || 0) + 1; });
var summary = order.filter(function (g) { return counts[g]; }).map(function (g) { return g + ' ' + counts[g] + '장'; }).join(' · ');
return {
prices: prices.map(function (p, i) { return { t: p.toLocaleString() + '원', border: s.price === i ? '2px solid #141414' : '1px solid #DDDBE2', pick: function () { self.setState({ price: i }); } }; }),
ten: (prices[s.price] * 10).toLocaleString() + '원', cards: cards, summary: summary,
swBg: s.free ? '#141414' : '#D6D5DC', swX: s.free ? 21 : 3, toggleFree: function () { self.setState({ free: !self.state.free }); }
};
}
}
</script>
</body>
</html>

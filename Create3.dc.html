<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>판매 등록 3단계</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<header style="height: 56px; padding: 0 8px; display: flex; align-items: center; flex-shrink: 0">
<a href="Create2.dc.html" aria-label="이전 단계" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<div style="flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">소개 · 보상</div>
<div style="width: 44px; text-align: center; font-size: 13px; color: #6B6B73">3 / 4</div>
</header>
<div style="height: 3px; background: #F0EEF3; margin: 0 16px; flex-shrink: 0"><div style="width: 75%; height: 3px; background: #141414"></div></div>
<div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">시리즈 이름<input id="c3-name" value="겨울 고양이" style="height: 46px; border-radius: 12px; border: 1px solid #DDDBE2; padding: 0 14px; font-size: 15px; font-weight: 400; color: #141414"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">소개<textarea id="c3-desc" placeholder="이 시리즈를 한두 줄로 소개해 주세요" style="height: 80px; border-radius: 12px; border: 1px solid #DDDBE2; padding: 12px 14px; font-size: 15px; font-weight: 400; color: #141414; resize: none"></textarea></label>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 600">판매 기간</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
<button onClick="{{p.pick}}" style="height: 44px; border-radius: 12px; border: {{p.border}}; background: #ffffff; font-family: inherit; font-size: 14px; font-weight: 600; color: #141414; cursor: pointer">{{p.t}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 600">완성 보상 (여러 개 선택)</div>
<sc-for list="{{rewards}}" as="r" hint-placeholder-count="3">
<button onClick="{{r.toggle}}" style="min-height: 50px; border-radius: 12px; border: 1px solid #E6E4EA; background: #ffffff; padding: 0 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; font-size: 15px; color: #141414; cursor: pointer; text-align: left">
<div style="width: 22px; height: 22px; border-radius: 6px; border: 2px solid #141414; background: {{r.bg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<sc-if value="{{r.on}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
</div>
<div style="flex-grow: 1">{{r.t}}</div>
<div style="font-size: 12px; color: #6B6B73">{{r.d}}</div>
</button>
</sc-for>
</div>
</div>
<div style="flex-grow: 1"></div>
<div style="padding: 12px 16px 20px; border-top: 1px solid #F0EEF3; display: flex; justify-content: flex-end">
<a href="Create4.dc.html" style="height: 44px; padding: 0 24px; border-radius: 12px; background: #141414; color: #ffffff; display: flex; align-items: center; font-size: 15px; font-weight: 600">다음</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { period: 0, rw: [true, true, false] }; }
renderVals() {
var self = this, s = this.state;
return {
periods: ['7일', '14일', '30일'].map(function (t, i) { return { t: t, border: s.period === i ? '2px solid #141414' : '1px solid #DDDBE2', pick: function () { self.setState({ period: i }); } }; }),
rewards: [['아트 프린트', '제작·배송 대행'], ['아크릴 키링', '제작·배송 대행'], ['원화 추첨', '1명 · 직접 발송']].map(function (x, i) {
var on = s.rw[i];
return { t: x[0], d: x[1], on: on, bg: on ? '#141414' : '#ffffff', toggle: function () { var a = self.state.rw.slice(); a[i] = !a[i]; self.setState({ rw: a }); } };
})
};
}
}
</script>
</body>
</html>

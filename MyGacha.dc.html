<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 가챠</title>
<script src="./support.js"></script>
<script src="./catalog.js"></script>
<script src="./cards.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<header style="height: 56px; padding: 0 16px; display: flex; align-items: center; flex-shrink: 0">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">내 가챠</h1>
</header>
<div style="display: flex; gap: 8px; padding: 0 16px 12px; flex-shrink: 0">
<button onClick="{{showIng}}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{c1.line}}; background: {{c1.bg}}; color: {{c1.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">모으는 중 5</button>
<button onClick="{{showDone}}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{c2.line}}; background: {{c2.bg}}; color: {{c2.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">완성 1</button>
</div>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div style="flex-grow: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 14px">
<article style="border: 1px solid #E6E4EA; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 44px; height: 44px; border-radius: 50%; background: #C6D8A9"></div>
<div style="flex-grow: 1">
<div style="font-size: 15px; font-weight: 600">숲속 우체국 시리즈</div>
<div style="font-size: 12px; color: #6B6B73">yeon.art · 9월 20일 완성</div>
</div>
<div style="height: 24px; padding: 0 10px; border-radius: 12px; background: #141414; color: #ffffff; font-size: 12px; font-weight: 600; display: flex; align-items: center">완성</div>
</div>
<div style="height: 120px; border-radius: 12px; overflow: hidden">
<svg width="100%" height="120" viewBox="0 0 1000 130" preserveAspectRatio="xMidYMid slice" style="display: block">
<rect x="0" y="0" width="1000" height="130" fill="#DCE8C8"></rect>
<circle cx="170" cy="34" r="14" fill="#FFFFFF"></circle>
<path d="M0 88 C120 70 260 104 420 84 S720 62 860 86 S980 96 1000 90 V130 H0Z" fill="#7FA36A"></path>
<path d="M0 108 C160 96 300 118 500 104 S820 94 1000 110 V130 H0Z" fill="#4E7440"></path>
<rect x="600" y="52" width="26" height="22" fill="#B85C3C"></rect><path d="M596 54 L613 40 L630 54Z" fill="#8C3E28"></path>
</svg>
</div>
<div style="padding: 12px; border-radius: 12px; background: #F6F5F8; font-size: 13px; color: #45454C">완성 보상: 아트 프린트 또는 키링 중 1개를 실물로 받을 수 있어요</div>
<a href="Reward.dc.html" style="height: 50px; border-radius: 14px; background: #141414; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">실물 보상 받기</a>
</article>
</div>
</sc-if>
<sc-if value="{{ing}}" hint-placeholder-val="{{true}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{series}}" as="m" hint-placeholder-count="4">
<article style="margin: 0 16px; border: 1px solid #E6E4EA; border-radius: 20px; padding: 16px 0 12px; display: flex; flex-direction: column; gap: 12px">
<a href="{{m.book}}" style="display: flex; align-items: center; gap: 10px; padding: 0 16px">
<div style="width: 44px; height: 44px; border-radius: 50%; box-sizing: border-box; border: 2px solid {{m.ring}}; padding: 3px"><div style="width: 100%; height: 100%; border-radius: 50%; background: {{m.av}}"></div></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-size: 15px; font-weight: 600">{{m.title}} 시리즈</div>
<div style="font-size: 12px; color: #6B6B73">{{m.artist}} · {{m.left}}</div>
</div>
<div style="font-size: 15px; font-weight: 700">{{m.count}}<span style="color: #8E8E96; font-weight: 500; font-size: 12px"> / 50</span></div>
</a>
<div class="scroll" style="display: flex; gap: 4px; padding: 0 16px; overflow-x: auto">
<sc-for list="{{m.strip}}" as="c" hint-placeholder-count="12">
<sc-if value="{{c.have}}" hint-placeholder-val="{{true}}">
<a href="{{c.href}}" aria-label="{{c.label}}" style="width: 54px; height: 70px; flex-shrink: 0; border-radius: 6px; overflow: hidden; box-sizing: border-box; border: {{c.bw}}px solid {{c.line}}; position: relative">
<dc-import name="Pic" sid="{{m.id}}" n="{{c.n}}" flat="{{c.flat}}" hint-size="100%,100%"></dc-import>
</a>
</sc-if>
<sc-if value="{{c.miss}}" hint-placeholder-val="{{false}}">
<div style="width: 54px; height: 70px; flex-shrink: 0; border-radius: 6px; background: #EEEDF2; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #B3B1BC">{{c.no}}</div>
</sc-if>
</sc-for>
</div>
<a href="{{m.book}}" style="margin: 0 16px; font-size: 13px; color: #45454C; display: flex; justify-content: space-between">
<span>{{m.gradeLine}}</span><span style="font-weight: 600">도감 보기 ›</span>
</a>
</article>
</sc-for>
<div style="height: 16px; flex-shrink: 0"></div>
</div>
</sc-if>
<dc-import name="TabBar" active="gacha" hint-size="390px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { tab: 'ing', liked: false, saved: false }; }
renderVals() {
var GG = window.GACHA, CC = window.GCARD;
var seriesList = (GG && CC) ? ['night', 'bunny', 'dusk', 'sea', 'pink'].map(function (id) {
var x = GG.get(id), a = GG.artist(x.artist), own = CC.owned(id), has = {};
own.forEach(function (n) { has[n] = 1; });
var strip = [], first = [], rest = [];
for (var n = 0; n < 50; n++) { var gi = CC.info(n); var it = { n: n, have: !!has[n], miss: !has[n], no: ('00' + (n + 1)).slice(-3), line: gi.color, bw: gi.key === 'C' ? 1 : 2, flat: gi.key !== 'L', label: CC.name(x, n) + ' 보기', href: 'CardView.dc.html?s=' + id + '&n=' + n }; (has[n] ? first : rest).push(it); }
strip = first.concat(rest.slice(0, 6));
var rc = own.filter(function (n) { return n >= 38; }).length;
return { id: id, title: x.title, artist: x.artist, av: a.av, ring: own.length >= 45 ? '#E0457B' : '#D9D7DE', count: own.length,
left: own.length >= 50 ? '도감 완성!' : (50 - own.length) + '장 남음', strip: strip, gradeLine: '레어 이상 ' + rc + ' / 12장', book: 'GachaWide.dc.html?s=' + id };
}).filter(function (m) { return m.count > 0 && m.count < 50; }) : [];
var self = this, s = this.state;
var on = { line: '#141414', bg: '#141414', fg: '#ffffff' }, off = { line: '#DDDBE2', bg: '#ffffff', fg: '#141414' };
var pal = {
night: { sky: '#26215C', moon: '#F4E9C8', star: '#F2C94C', w1: '#4B3FB0', w2: '#342A86', cat: '#120F2E' },
sea: { sky: '#123E4C', moon: '#F5D7A8', star: '#F5D7A8', w1: '#2E8C98', w2: '#1D6672', cat: '#123E4C' }
};
var gray = { sky: '#E6E5EA', moon: '#F1F0F3', star: '#F1F0F3', w1: '#D6D5DC', w2: '#CAC9D1', cat: '#BDBCC5' };
function strip(p, owned) {
var out = [];
for (var i = 0; i < 10; i++) {
var c = owned.indexOf(i) >= 0 ? p : gray;
out.push({ vb: (i * 100) + ' 0 100 130', sky: c.sky, moon: c.moon, star: c.star, w1: c.w1, w2: c.w2, cat: c.cat });
}
return out;
}
var A = window.GA && window.GA.signedIn ? window.GA : null;
function owned(series, fallback) {
if (!A) return fallback;
var o = [];
(A.prof.pulls || []).forEach(function (q) { if (q.s === series && o.indexOf(q.i) < 0) o.push(q.i); });
return o;
}
var on_ = owned('night', [0, 1, 2, 4, 5, 6, 8]), os_ = owned('sea', [0, 1, 3, 7]);
function left(n) { return n >= 10 ? '완성!' : (10 - n) + '장 남음'; }
var extra = [
['노을 골목 시리즈', 'pixel_hana', '#F1C6A8', { sky: '#F2B38A', moon: '#FFF1D6', star: '#FFF1D6', w1: '#D9745B', w2: '#A64B3C', cat: '#F2B38A' }, [0, 2, 3, 5, 6, 8, 9]],
['숲속 우체국 시리즈', 'yeon.art', '#C6D8A9', { sky: '#DCE8C8', moon: '#FFFFFF', star: '#FFFFFF', w1: '#7FA36A', w2: '#4E7440', cat: '#DCE8C8' }, [1, 4]],
['분홍 섬 시리즈', 'coral.p', '#E8C6D8', { sky: '#F7D5DE', moon: '#FFF4F6', star: '#FFFFFF', w1: '#E08CA3', w2: '#B85C78', cat: '#F7D5DE' }, [0, 1, 2, 3, 5, 7, 8, 9]]
];
var more = extra.map(function (x) { return { title: x[0], artist: x[1], av: x[2], strip: strip(x[3], x[4]), left: left(x[4].length) }; });
return { series: seriesList, more: more, night: strip(pal.night, on_), sea: strip(pal.sea, os_), nightLeft: left(on_.length), seaLeft: left(os_.length),
ing: s.tab === 'ing', done: s.tab === 'done', c1: s.tab === 'ing' ? on : off, c2: s.tab === 'done' ? on : off,
showIng: function () { self.setState({ tab: 'ing' }); }, showDone: function () { self.setState({ tab: 'done' }); },
heartFill: s.liked ? '#E0457B' : 'none', heartLine: s.liked ? '#E0457B' : '#141414', saveFill: s.saved ? '#141414' : 'none',
like: function () { self.setState({ liked: !self.state.liked }); }, save: function () { self.setState({ saved: !self.state.saved }); } };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문·배송 조회</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<dc-import name="Header" title="주문·배송 조회" back="MyMenu.dc.html" hint-size="390px,56px"></dc-import>
<div style="padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
<div style="border: 1px solid #E6E4EA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 12px; align-items: center">
<div style="width: 56px; height: 56px; border-radius: 10px; background: {{o.color}}; flex-shrink: 0"></div>
<div style="flex-grow: 1">
<div style="font-size: 15px; font-weight: 600">{{o.item}}</div>
<div style="font-size: 12px; color: #6B6B73">{{o.from}} · {{o.date}}</div>
</div>
<div style="height: 24px; padding: 0 10px; border-radius: 12px; background: {{o.pillBg}}; color: {{o.pillFg}}; font-size: 12px; font-weight: 600; display: flex; align-items: center">{{o.status}}</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{o.steps}}" as="s" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px"><div style="height: 4px; border-radius: 2px; background: {{s.c}}"></div><div style="font-size: 11px; color: {{s.fc}}">{{s.t}}</div></div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var names = ['신청 완료', '제작 중', '배송 중', '도착'];
function steps(n) { return names.map(function (t, i) { return { t: t, c: i < n ? '#141414' : '#E6E4EA', fc: i < n ? '#141414' : '#8E8E96' }; }); }
return { orders: [
{ item: '숲속 우체국 아트 프린트', from: '완성 보상', date: '9월 21일', color: '#7FA36A', status: '배송 중', pillBg: '#141414', pillFg: '#ffffff', steps: steps(3) },
{ item: '밤의 고양이 키링', from: '마켓 구매', date: '9월 25일', color: '#4B3FB0', status: '제작 중', pillBg: '#F0EEF3', pillFg: '#141414', steps: steps(2) },
{ item: '노을 골목 엽서 세트', from: '완성 보상', date: '8월 30일', color: '#D9745B', status: '도착', pillBg: '#F0EEF3', pillFg: '#45454C', steps: steps(4) }
] };
}
}
</script>
</body>
</html>

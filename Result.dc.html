<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카드 획득</title>
<script src="./support.js"></script>
<script src="./catalog.js"></script>
<script src="./cards.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Caveat:wght@600&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
@keyframes frame-shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.frame-r{background:linear-gradient(120deg,#3E7BD6,#9FE8FF,#3E7BD6,#B8D8FF,#3E7BD6);background-size:200% 100%;animation:frame-shine 3s linear infinite}
.frame-e{background:linear-gradient(120deg,#8A4FD1,#F2C94C,#E36BD8,#8A4FD1,#FFD36B);background-size:200% 100%;animation:frame-shine 2.4s linear infinite}
.frame-l{background:linear-gradient(120deg,#D98A1E,#FFF1B8,#E36BD8,#7AF7FF,#FFD36B,#D98A1E);background-size:200% 100%;animation:frame-shine 1.8s linear infinite}
@media (prefers-reduced-motion:reduce){.frame-r,.frame-e,.frame-l{animation:none}}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; background: {{pageBg}}; display: flex; flex-direction: column; align-items: center; font-family: 'IBM Plex Sans KR', sans-serif; color: {{ink}}">
<div style="padding-top: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="height: 26px; padding: 0 12px; border-radius: 13px; background: {{gc}}; color: #ffffff; font-size: 13px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center">{{gname}}</div>
<div style="font-size: 22px; font-weight: 700; margin-top: 8px">{{headline}}</div>
<div style="font-size: 14px; color: {{sub}}">{{ser.title}} · {{progress}}</div>
</div>
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 16px 0">
<a href="{{viewHref}}" aria-label="카드 크게 보기" class="{{frameCls}}" style="display: block; width: 248px; height: 346px; border-radius: 18px; box-sizing: border-box; padding: {{framePad}}px; background-color: {{gc}}; transform: perspective(800px) rotateY(-8deg) rotateX(4deg); box-shadow: 0 18px 40px {{shadow}}">
<div style="width: 100%; height: 100%; border-radius: 12px; background: #ffffff; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 7px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 6px">
<div style="font-size: 13px; font-weight: 700; color: #141414; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cardName}}</div>
<div style="font-size: 10px; font-weight: 700; color: #45454C; flex-shrink: 0">{{no}}</div>
</div>
<div style="flex-grow: 1; border-radius: 8px; overflow: hidden; position: relative; border: 1px solid #E6E4EA">
<dc-import name="Pic" sid="{{ser.id}}" n="{{n}}" hint-size="100%,100%"></dc-import>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="font-size: 10px; font-weight: 600; color: #6B6B73">No.{{serial}}</div>
<div style="font-family: 'Caveat', cursive; font-size: 15px; color: #45454C; line-height: 1; white-space: nowrap">{{ser.artist}}</div>
</div>
</div>
</a>
</div>
<div style="width: 100%; box-sizing: border-box; padding: 0 16px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="Draw.dc.html{{sq}}" style="height: 54px; border-radius: 14px; border: 1px solid #DDDBE2; background: #ffffff; color: #141414; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">한 번 더</a>
<a href="{{bookHref}}" style="height: 54px; border-radius: 14px; background: #141414; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">도감에서 보기</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) {
super(p);
var C = window.GCARD, n = C ? parseInt(C.param('n'), 10) : 45;
if (isNaN(n) || n < 0 || n > 49) n = C ? C.roll() : 45;
this.state = { n: n, serial: 12 + Math.floor(Math.random() * 400) };
}
renderVals() {
var SER = window.GACHA ? window.GACHA.current() : { id: 'night', title: '밤의 고양이', artist: 'moonlit_draws' };
var C = window.GCARD, n = this.state.n, gi = C ? C.info(n) : { key: 'E', color: '#8A4FD1', name: 'Epic' };
var sp = gi.key === 'R' || gi.key === 'E' || gi.key === 'L';
var owned = 0;
if (window.GA && window.GA.signedIn) { var seen = {}; (window.GA.prof.pulls || []).forEach(function (q) { if (q.s === SER.id) seen[q.i] = 1; }); owned = Object.keys(seen).length; }
var HL = { C: '새 카드를 얻었어요', U: '좋은 카드가 나왔어요!', R: '반짝이는 레어 카드!', E: '에픽 카드 등장!!', L: '전설의 카드를 뽑았어요!!!' }[gi.key];
return {
ser: SER, sq: '?s=' + SER.id, n: n, no: C ? C.no(n) : '046/050', cardName: C ? C.name(SER, n) : SER.title,
gname: gi.key === 'L' ? 'LEGENDARY' : gi.name.toUpperCase(), gc: gi.color, headline: HL,
progress: owned ? '도감 ' + owned + ' / 50' : '카드 50장 중 1장',
serial: this.state.serial, viewHref: 'CardView.dc.html?s=' + SER.id + '&n=' + n, bookHref: 'GachaWide.dc.html?s=' + SER.id,
frameCls: gi.key === 'L' ? 'frame-l' : gi.key === 'E' ? 'frame-e' : gi.key === 'R' ? 'frame-r' : '',
framePad: sp ? 9 : 6, shadow: sp ? 'rgba(138, 79, 209, 0.4)' : 'rgba(20, 20, 20, 0.18)',
pageBg: sp ? '#15112A' : '#ffffff', ink: sp ? '#ffffff' : '#141414', sub: sp ? '#B9B4D6' : '#6B6B73'
};
}
}
</script>
</body>
</html>

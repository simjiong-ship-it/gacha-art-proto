<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카드 획득</title>
<script src="./support.js"></script>
<script src="./catalog.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Caveat:wght@600&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; align-items: center; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<div style="padding-top: 56px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="height: 26px; padding: 0 12px; border-radius: 13px; background: #8A4FD1; color: #ffffff; font-size: 13px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center">EPIC</div>
<div style="font-size: 22px; font-weight: 700; margin-top: 8px">새 조각을 얻었어요</div>
<div style="font-size: 14px; color: #6B6B73">{{ser.title}} · 이제 2장 남았어요</div>
</div>
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<div style="width: 240px; height: 336px; border-radius: 16px; box-sizing: border-box; border: 6px solid #8A4FD1; background: #ffffff; padding: 8px; display: flex; flex-direction: column; gap: 8px; transform: perspective(800px) rotateY(-8deg) rotateX(4deg); box-shadow: 0 18px 40px rgba(20, 20, 20, 0.18); position: relative; overflow: hidden">
<div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: #45454C"><span>004/010</span><span>No.37</span></div>
<div style="flex-grow: 1; border-radius: 8px; overflow: hidden">
<dc-import name="Art" sid="{{ser.id}}" vb="600 0 100 130" hint-size="100%,100%"></dc-import>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="font-size: 13px; font-weight: 600">{{ser.title}} #4</div>
<div style="font-family: 'Caveat', cursive; font-size: 20px; color: #45454C; line-height: 1">{{ser.artist}}</div>
</div>
<div style="position: absolute; top: -40px; left: 40px; width: 50px; height: 440px; background: rgba(255, 255, 255, 0.28); transform: rotate(24deg)"></div>
</div>
</div>
<div style="width: 100%; box-sizing: border-box; padding: 0 16px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="Draw.dc.html{{sq}}" style="height: 54px; border-radius: 14px; border: 1px solid #DDDBE2; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">한 번 더</a>
<a href="MyGacha.dc.html" style="height: 54px; border-radius: 14px; background: #141414; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">내 가챠에서 보기</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { var SER = window.GACHA ? window.GACHA.current() : { id: 'night', title: '밤의 고양이', artist: 'moonlit_draws' };
return { ser: SER, sq: '?s=' + SER.id, }; }
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈 피드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414; position: relative">
<header style="height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
<div style="font-size: 22px; font-weight: 700; letter-spacing: -0.5px">Gacha art</div>
<a href="Notifications.dc.html" aria-label="알림" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; position: relative">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg>
<div style="position: absolute; top: 10px; right: 11px; width: 7px; height: 7px; border-radius: 50%; background: #E0457B"></div>
</a>
</header>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column">
<div style="display: flex; gap: 14px; padding: 4px 16px 14px; border-bottom: 1px solid #F0EEF3">
<sc-for list="{{artists}}" as="ar" hint-placeholder-count="5">
<a href="SellerPage.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 62px">
<div style="width: 58px; height: 58px; border-radius: 50%; box-sizing: border-box; padding: 3px; border: 2px solid {{ar.ring}}">
<div style="width: 100%; height: 100%; border-radius: 50%; background: {{ar.bg}}"></div>
</div>
<div style="font-size: 11px; color: #45454C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62px">{{ar.name}}</div>
</a>
</sc-for>
</div>
<article style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 34px; height: 34px; border-radius: 50%; background: #B3AEEA"></div>
<div style="flex-grow: 1">
<div style="font-size: 14px; font-weight: 600">moonlit_draws</div>
<div style="font-size: 12px; color: #6B6B73">새 시리즈 · 그림 10장</div>
</div>
<svg width="20" height="20" viewBox="0 0 24 24" fill="#6B6B73"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
</div>
<a href="Detail.dc.html" aria-label="밤의 고양이 시리즈 보기" style="display: block; width: 358px; height: 220px; border-radius: 16px; overflow: hidden">
<svg width="358" height="220" viewBox="520 0 212 130" preserveAspectRatio="xMidYMid slice" style="display: block">
<rect x="0" y="0" width="1000" height="130" fill="#26215C"></rect>
<circle cx="560" cy="40" r="1.4" fill="#F2C94C"></circle><circle cx="700" cy="18" r="1.6" fill="#F2C94C"></circle><circle cx="610" cy="22" r="1" fill="#F4E9C8"></circle>
<path d="M0 88 C120 70 260 104 420 84 S720 62 860 86 S980 96 1000 90 V130 H0Z" fill="#4B3FB0"></path>
<path d="M0 108 C160 96 300 118 500 104 S820 94 1000 110 V130 H0Z" fill="#342A86"></path>
<ellipse cx="640" cy="66" rx="11" ry="9" fill="#120F2E"></ellipse><circle cx="650" cy="53" r="6.5" fill="#120F2E"></circle><path d="M645 49 L646 41 L650 47Z M652 47 L656 41 L656 50Z" fill="#120F2E"></path><path d="M630 70 q-10 -3 -7 -14" stroke="#120F2E" stroke-width="2.4" fill="none" stroke-linecap="round"></path>
</svg>
</a>
<div style="display: flex; align-items: center; gap: 6px; margin-left: -10px">
<button onClick="{{like}}" aria-label="좋아요" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="{{heartFill}}" stroke="{{heartLine}}" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"></path></svg>
</button>
<a href="Detail.dc.html" aria-label="댓글" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"></path></svg>
</a>
<button onClick="{{share}}" aria-label="공유" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8" stroke-linejoin="round"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"></path></svg>
</button>
<div style="flex-grow: 1"></div>
<button onClick="{{save}}" aria-label="찜하기" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-right: -10px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="{{saveFill}}" stroke="#141414" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4-6 4z"></path></svg>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; margin-top: -8px">
<div style="font-size: 16px; font-weight: 600">밤의 고양이 시리즈</div>
<div style="font-size: 13px; color: #6B6B73">1회 3,000원 · 뽑기 1,208회</div>
</div>
</article>
<article style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 34px; height: 34px; border-radius: 50%; background: #9CCBD3"></div>
<div style="flex-grow: 1">
<div style="font-size: 14px; font-weight: 600">sea_mint</div>
<div style="font-size: 12px; color: #6B6B73">마감 D-3 · 그림 10장</div>
</div>
</div>
<a href="Detail.dc.html" aria-label="새벽 바다 시리즈 보기" style="display: block; width: 358px; height: 220px; border-radius: 16px; overflow: hidden">
<svg width="358" height="220" viewBox="300 0 212 130" preserveAspectRatio="xMidYMid slice" style="display: block">
<rect x="0" y="0" width="1000" height="130" fill="#123E4C"></rect>
<circle cx="420" cy="42" r="16" fill="#F5D7A8"></circle>
<path d="M0 84 C120 70 260 100 420 82 S720 64 1000 88 V130 H0Z" fill="#2E8C98"></path>
<path d="M0 106 C160 94 300 116 500 100 S820 92 1000 108 V130 H0Z" fill="#1D6672"></path>
</svg>
</a>
</article>
</div>
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); padding: 10px 16px; border-radius: 20px; background: #141414; color: #ffffff; font-size: 13px; white-space: nowrap; z-index: 5">{{toast}}</div></sc-if>
<dc-import name="TabBar" active="home" hint-size="390px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { liked: false, saved: false, toast: '' }; }
flash(msg) { var self = this; this.setState({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(function () { self.setState({ toast: '' }); }, 1600); }
renderVals() {
var self = this, s = this.state;
return {
toast: s.toast,
heartFill: s.liked ? '#E0457B' : 'none', heartLine: s.liked ? '#E0457B' : '#141414', saveFill: s.saved ? '#141414' : 'none',
like: function () { self.setState({ liked: !self.state.liked }); },
save: function () { var v = !self.state.saved; self.setState({ saved: v }); self.flash(v ? '찜 목록에 담았어요' : '찜을 취소했어요'); },
share: function () { self.flash('링크를 복사했어요'); },
artists: [
{ name: 'moonlit_draws', bg: '#B3AEEA', ring: '#E0457B' },
{ name: 'sea_mint', bg: '#9CCBD3', ring: '#E0457B' },
{ name: 'pixel_hana', bg: '#F1C6A8', ring: '#E0457B' },
{ name: 'ddong_gom', bg: '#CFC7B8', ring: '#D9D7DE' },
{ name: 'yeon.art', bg: '#C6D8A9', ring: '#D9D7DE' }
]
};
}
}
</script>
</body>
</html>

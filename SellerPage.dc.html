<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>판매자 페이지</title>
<script src="./support.js"></script>
<script src="./catalog.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414; position: relative">
<header style="height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
<a href="Explore.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<div style="flex-grow: 1; font-size: 17px; font-weight: 600">{{a.id}}</div>
</header>
<div style="flex-grow: 1; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 20px; padding: 8px 16px 12px">
<div style="width: 84px; height: 84px; border-radius: 50%; background: {{a.av}}; flex-shrink: 0"></div>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center">
<div><div style="font-size: 18px; font-weight: 700">{{count}}</div><div style="font-size: 12px; color: #6B6B73">시리즈</div></div>
<div><div style="font-size: 18px; font-weight: 700">{{a.followers}}</div><div style="font-size: 12px; color: #6B6B73">팔로워</div></div>
<div><div style="font-size: 18px; font-weight: 700">{{a.fans}}</div><div style="font-size: 12px; color: #6B6B73">완성한 팬</div></div>
</div>
</div>
<div style="padding: 0 16px 14px; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 600">{{a.name}}</div>
<div style="font-size: 13px; color: #45454C">{{a.bio}}</div>
</div>
<div style="padding: 0 16px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button onClick="{{follow}}" style="height: 40px; border-radius: 10px; border: 1px solid {{fLine}}; background: {{fBg}}; color: {{fFg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{fLabel}}</button>
<button onClick="{{msg}}" style="height: 40px; border-radius: 10px; border: 1px solid #DDDBE2; background: #ffffff; color: #141414; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">메시지</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #ECEAF0">
<button onClick="{{tabNow}}" style="height: 44px; border: 0; border-bottom: 2px solid {{t1Line}}; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: {{t1Fg}}; cursor: pointer">판매 중</button>
<button onClick="{{tabPast}}" style="height: 44px; border: 0; border-bottom: 2px solid {{t2Line}}; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: {{t2Fg}}; cursor: pointer">지난 시리즈</button>
</div>
<sc-if value="{{past}}" hint-placeholder-val="{{false}}">
<div style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="height: 150px; border-radius: 14px; overflow: hidden; position: relative; filter: grayscale(0.85); opacity: .75"><dc-import name="Art" sid="{{firstId}}" vb="300 0 300 130" hint-size="100%,150px"></dc-import></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #6B6B73"><span>지난 시즌 · 판매 종료</span><span>완성한 팬 {{a.fans}}명</span></div>
</div>
</sc-if>
<sc-if value="{{now}}" hint-placeholder-val="{{true}}">
<div style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{list}}" as="o" hint-placeholder-count="2">
<a href="{{o.href}}" style="display: flex; flex-direction: column; gap: 8px">
<div style="height: 150px; border-radius: 14px; overflow: hidden; position: relative">
<dc-import name="Art" sid="{{o.id}}" vb="500 0 310 130" hint-size="100%,150px"></dc-import>
<sc-if value="{{o.tag}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 8px; top: 8px; height: 22px; padding: 0 8px; border-radius: 11px; background: #ffffff; font-size: 11px; font-weight: 600; display: flex; align-items: center">{{o.tag}}</div></sc-if>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 15px; font-weight: 600">{{o.title}} 시리즈</div>
<div style="font-size: 13px; color: #6B6B73">1회 {{o.priceText}} · 마감 {{o.due}}</div>
</div>
</a>
</sc-for>
<div style="height: 90px; border-radius: 14px; background: #F0EEF3; border: 1px dashed #C9C7D0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #6B6B73">다음 시리즈 · 곧 공개</div>
</div>
</sc-if>
</div>
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 10px 16px; border-radius: 20px; background: #141414; color: #ffffff; font-size: 13px; white-space: nowrap">{{toast}}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { f: false, tab: 'now', toast: '' }; }
renderVals() {
var self = this, s = this.state;
var G = window.GACHA;
var a = G ? G.currentArtist() : { id: 'moonlit_draws', name: '달빛 그리는 사람', av: '#B3AEEA', followers: '2,410', fans: 86, bio: '' };
var list = G ? G.byArtist(a.id).map(function (o) { return Object.assign({ href: 'Detail.dc.html?s=' + o.id }, o); }) : [];
return {
a: a, list: list, count: list.length + 1, firstId: list.length ? list[0].id : 'night',
fLabel: s.f ? '팔로잉' : '팔로우', fBg: s.f ? '#ffffff' : '#141414', fFg: s.f ? '#141414' : '#ffffff', fLine: s.f ? '#DDDBE2' : '#141414',
follow: function () { self.setState({ f: !self.state.f }); },
msg: function () { self.setState({ toast: '메시지는 곧 열려요' }); clearTimeout(self._t); self._t = setTimeout(function () { self.setState({ toast: '' }); }, 1600); },
toast: s.toast, now: s.tab === 'now', past: s.tab === 'past',
t1Line: s.tab === 'now' ? '#141414' : 'transparent', t2Line: s.tab === 'past' ? '#141414' : 'transparent',
t1Fg: s.tab === 'now' ? '#141414' : '#6B6B73', t2Fg: s.tab === 'past' ? '#141414' : '#6B6B73',
tabNow: function () { self.setState({ tab: 'now' }); }, tabPast: function () { self.setState({ tab: 'past' }); }
};
}
}
</script>
</body>
</html>

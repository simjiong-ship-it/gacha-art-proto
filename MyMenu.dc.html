<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>설정 및 활동</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<header style="height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
<a href="My.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<div style="font-size: 17px; font-weight: 600">설정 및 활동</div>
</header>
<div style="padding: 4px 16px 12px">
<label style="height: 40px; border-radius: 12px; background: #F3F1F6; display: flex; align-items: center; gap: 8px; padding: 0 12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
<input placeholder="검색" aria-label="메뉴 검색" style="border: 0; background: transparent; font-family: inherit; font-size: 14px; flex-grow: 1; outline: none">
</label>
</div>
<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 10px 16px 6px; font-size: 13px; color: #6B6B73">판매</div>
<a href="SellerCenter.dc.html" style="margin: 0 12px; padding: 0 12px; height: 60px; border-radius: 14px; background: #F3F1F6; display: flex; align-items: center; gap: 12px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 5.5 4h13L20 9.5M4 9.5V20h16V9.5M4 9.5c0 1.6 1.3 2.5 2.7 2.5S9.3 11.1 9.3 9.5c0 1.6 1.3 2.5 2.7 2.5s2.7-.9 2.7-2.5c0 1.6 1.3 2.5 2.6 2.5S20 11.1 20 9.5M10 20v-4.5h4V20"></path></svg>
<div style="flex-grow: 1">
<div style="font-size: 15px; font-weight: 600">판매자 센터</div>
<div style="font-size: 12px; color: #6B6B73">내 가챠 관리 · 주문 · 정산</div>
</div>
<div style="height: 22px; padding: 0 8px; border-radius: 11px; background: #E0457B; color: #ffffff; font-size: 12px; font-weight: 600; display: flex; align-items: center">새 주문 2</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E96" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg>
</a>
<a href="SellerPage.dc.html" style="height: 52px; padding: 0 24px; display: flex; align-items: center; gap: 12px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20.5c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5"></path></svg>
<div style="flex-grow: 1; font-size: 15px">내 판매 페이지 보기</div>
</a>
<div style="height: 8px; background: #F6F5F8; margin: 10px 0"></div>
<div style="padding: 6px 16px 4px; font-size: 13px; color: #6B6B73">내 활동</div>
<sc-for list="{{act}}" as="m" hint-placeholder-count="4">
<a href="{{m.href}}" style="height: 50px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; font-size: 15px">{{m.t}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B0AFB7" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg></a>
</sc-for>
<div style="height: 8px; background: #F6F5F8; margin: 6px 0"></div>
<div style="padding: 6px 16px 4px; font-size: 13px; color: #6B6B73">계정</div>
<sc-for list="{{acc}}" as="m" hint-placeholder-count="3">
<a href="{{m.href}}" style="height: 50px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; font-size: 15px">{{m.t}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B0AFB7" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg></a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
act: [{ t: '주문·배송 조회', href: 'Orders.dc.html' }, { t: '결제 내역', href: 'Payments.dc.html' }, { t: '중복 조각 교환', href: 'Exchange.dc.html' }, { t: '알림', href: 'Notifications.dc.html' }],
acc: [{ t: '배송지 관리', href: 'Address.dc.html' }, { t: '고객센터', href: 'Support.dc.html' }, { t: '로그아웃', href: 'Login.dc.html' }]
};
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 등록 4단계</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
<header style="height: 56px; padding: 0 8px; display: flex; align-items: center; flex-shrink: 0">
<a href="Create3.dc.html" aria-label="이전 단계" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<div style="flex-grow: 1; text-align: center; font-size: 17px; font-weight: 600">마지막 확인</div>
<div style="width: 44px; text-align: center; font-size: 13px; color: #6B6B73">4 / 4</div>
</header>
<div style="height: 3px; background: #141414; margin: 0 16px; flex-shrink: 0"></div>
<div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="height: 170px; border-radius: 16px; background: #E8EDF4; display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box; gap: 4px">
<sc-for list="{{thumbs}}" as="t" hint-placeholder-count="10"><div style="flex-grow: 1; height: 60px; border-radius: 4px; background: {{t}}"></div></sc-for>
</div>
<div style="font-size: 20px; font-weight: 700">겨울 고양이</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; border-bottom: 1px solid #F0EEF3"><span style="color: #6B6B73">{{r.k}}</span><span style="font-weight: 600">{{r.v}}</span></div>
</sc-for>
<div style="font-size: 12px; color: #6B6B73; line-height: 1.6">등록하면 검수 후 공개돼요. 확률은 시리즈 화면에 그대로 공개돼요.</div>
</div>
<div style="flex-grow: 1"></div>
<div style="padding: 12px 16px 20px">
<button onClick="{{submit}}" style="width: 100%; height: 54px; border-radius: 14px; border: 0; background: #141414; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">등록하기</button>
</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 24px; text-align: center">
<div style="width: 72px; height: 72px; border-radius: 50%; background: #141414; display: flex; align-items: center; justify-content: center">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>
</div>
<div style="font-size: 20px; font-weight: 700">등록했어요</div>
<div style="font-size: 14px; color: #45454C">검수가 끝나면 알림으로 알려드릴게요</div>
</div>
<div style="padding: 0 16px 24px">
<a href="SellerCenter.dc.html" style="height: 54px; border-radius: 14px; background: #141414; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">판매자 센터로</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { done: false }; }
renderVals() {
var self = this;
return {
editing: !this.state.done, done: this.state.done,
thumbs: ['#AEBBD0', '#A3B1C8', '#98A7C0', '#8D9DB8', '#8293B0', '#7C8BA6', '#7483A0', '#6C7B98', '#647390', '#5C6B88'],
rows: [{ k: '그림', v: '10장 · 개별' }, { k: '1회 가격', v: '3,000원' }, { k: '등급', v: 'C 5 · U 2 · R 2 · E 1' }, { k: '판매 기간', v: '7일' }, { k: '완성 보상', v: '아트 프린트, 키링' }],
submit: function () { self.setState({ done: true }); }
};
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상단 바</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<header style="width: 390px; height: 56px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; gap: 4px; background: #ffffff; flex-shrink: 0; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<a href="{{back}}" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<div style="flex-grow: 1; font-size: 17px; font-weight: 600">{{title}}</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"제목"},"back":{"editor":"text","default":"Main.dc.html"},"$preview":{"width":390,"height":56}}'>
class Component extends DCLogic {
renderVals() {
return { title: this.props.title ?? '제목', back: this.props.back ?? 'Main.dc.html' };
}
}
</script>
</body>
</html>

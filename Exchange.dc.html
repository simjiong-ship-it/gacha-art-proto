<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중복 조각 교환소</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414; position: relative">
<dc-import name="Header" title="중복 조각 교환소" back="MyGacha.dc.html" hint-size="390px,56px"></dc-import>
<div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; color: #6B6B73">내 중복 조각 · 눌러서 내놓을 조각 고르기</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{mine}}" as="m" hint-placeholder-count="4">
<button onClick="{{m.pick}}" style="width: 78px; height: 104px; border-radius: 10px; border: 3px solid {{m.line}}; background: {{m.bg}}; padding: 0; position: relative; cursor: pointer">
<div style="position: absolute; left: 6px; bottom: 6px; font-size: 10px; font-weight: 700; color: #ffffff; font-family: 'IBM Plex Sans KR', sans-serif">{{m.no}}</div>
<div style="position: absolute; right: 5px; top: 5px; height: 17px; padding: 0 5px; border-radius: 9px; background: rgba(20, 20, 20, 0.6); color: #ffffff; font-size: 9px; font-weight: 700; display: flex; align-items: center; font-family: 'IBM Plex Sans KR', sans-serif">×{{m.n}}</div>
</button>
</sc-for>
</div>
</div>
<div style="padding: 22px 16px 8px; font-size: 13px; color: #6B6B73">내가 없는 조각을 가진 사람들</div>
<sc-for list="{{offers}}" as="o" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px">
<div style="width: 52px; height: 70px; border-radius: 8px; background: {{o.bg}}; flex-shrink: 0"></div>
<div style="flex-grow: 1">
<div style="font-size: 15px; font-weight: 600">{{o.piece}}</div>
<div style="font-size: 12px; color: #6B6B73">{{o.who}} · 원하는 조각 {{o.want}}</div>
</div>
<button onClick="{{o.ask}}" style="height: 36px; padding: 0 14px; border-radius: 10px; border: 0; background: #141414; color: #ffffff; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">교환 요청</button>
</div>
</sc-for>
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 10px 16px; border-radius: 20px; background: #141414; color: #ffffff; font-size: 13px; white-space: nowrap">{{toast}}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 0, toast: '' }; }
renderVals() {
var self = this;
var mine = [['#3A2F8F', '001/010', 4], ['#F2B38A', '005/010', 2], ['#7FA36A', '003/010', 3], ['#2E8C98', '008/010', 2]].map(function (x, i) {
return { bg: x[0], no: x[1], n: x[2], line: i === self.state.sel ? '#141414' : 'transparent', pick: function () { self.setState({ sel: i }); } };
});
var offers = [['밤의 고양이 003/010', 'luna_k', '001', '#342A86'], ['밤의 고양이 010/010', 'catlover', '001', '#26215C'], ['새벽 바다 005/010', 'jiwoo', '008', '#1D6672']].map(function (x) {
return { piece: x[0], who: x[1], want: x[2], bg: x[3], ask: function () { self.setState({ toast: x[1] + '님께 교환을 요청했어요' }); clearTimeout(self._t); self._t = setTimeout(function () { self.setState({ toast: '' }); }, 1800); } };
});
return { mine: mine, offers: offers, toast: this.state.toast };
}
}
</script>
</body>
</html>

<script type="text/x-dc" data-dc-script data-props='{"sid":{"editor":"text","default":"night"},"vb":{"editor":"text","default":"0 0 1000 130"},"gray":{"editor":"boolean","default":false},"$preview":{"width":390,"height":130}}'>
class Component extends DCLogic {
renderVals() {
var G = window.GACHA;
var s = G ? G.get(this.props.sid || 'night') : { sky: '#26215C', sun: '#F4E9C8', star: '#F2C94C', w1: '#4B3FB0', w2: '#342A86', fig: '#120F2E', kind: 'cat' };
var c = this.props.gray
  ? { sky: '#E6E5EA', sun: '#F1F0F3', star: '#F1F0F3', w1: '#D6D5DC', w2: '#CAC9D1', fig: '#BDBCC5' }
  : { sky: s.sky, sun: s.sun, star: s.star, w1: s.w1, w2: s.w2, fig: s.fig };
var f = { small: s.kind !== 'cat', ear: this.props.gray ? '#CAC9D1' : '#3A2F6E', cat: s.kind === 'cat', house: s.kind === 'house', whale: s.kind === 'whale', ghost: s.kind === 'ghost', bunny: s.kind === 'bunny', fox: s.kind === 'fox', bear: s.kind === 'bear' };
return { c: c, f: f, vb: this.props.vb || '0 0 1000 130' };
}
}
</script>

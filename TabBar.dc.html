</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","explore","add","gacha","my"],"default":"home"},"$preview":{"width":390,"height":64}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'home';
const keys = ['home','explore','add','gacha','my'];
const c = {}, w = {};
keys.forEach(function (k) { c[k] = k === a ? '#141414' : '#8E8E96'; w[k] = k === a ? 2.2 : 1.7; });
return { c: c, w: w };
}
}
</script>

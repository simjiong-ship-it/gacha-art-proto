<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시리즈 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<header style="height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
<a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<div style="font-size: 17px; font-weight: 600">밤의 고양이 시리즈</div>
</header>
<div style="flex-grow: 1; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<div style="height: 190px; border-radius: 16px; overflow: hidden; flex-shrink: 0">
<svg width="358" height="190" viewBox="470 0 325 130" preserveAspectRatio="xMidYMid slice" style="display: block">
<rect x="0" y="0" width="1000" height="130" fill="#26215C"></rect>
<circle cx="560" cy="40" r="1.4" fill="#F2C94C"></circle><circle cx="720" cy="20" r="1.6" fill="#F2C94C"></circle><circle cx="500" cy="24" r="1.2" fill="#F4E9C8"></circle>
<path d="M0 88 C120 70 260 104 420 84 S720 62 860 86 S980 96 1000 90 V130 H0Z" fill="#4B3FB0"></path>
<path d="M0 108 C160 96 300 118 500 104 S820 94 1000 110 V130 H0Z" fill="#342A86"></path>
<ellipse cx="640" cy="66" rx="11" ry="9" fill="#120F2E"></ellipse><circle cx="650" cy="53" r="6.5" fill="#120F2E"></circle><path d="M645 49 L646 41 L650 47Z M652 47 L656 41 L656 50Z" fill="#120F2E"></path>
</svg>
</div>
<a href="SellerPage.dc.html" style="display: flex; align-items: center; gap: 10px">
<div style="width: 36px; height: 36px; border-radius: 50%; background: #B3AEEA"></div>
<div style="flex-grow: 1; font-size: 15px; font-weight: 600">moonlit_draws</div>
<div style="font-size: 12px; color: #6B6B73">마감 D-7</div>
</a>
<div style="font-size: 13px; color: #6B6B73">포함된 그림 10장 · 모으면 한 폭의 그림</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="10">
<div style="height: 76px; border-radius: 8px; overflow: hidden; box-sizing: border-box; border: {{c.bw}}px solid {{c.line}}">
<svg width="100%" height="100%" viewBox="{{c.vb}}" preserveAspectRatio="xMidYMid slice" style="display: block">
<rect x="0" y="0" width="1000" height="130" fill="#26215C"></rect>
<circle cx="170" cy="34" r="14" fill="#F4E9C8"></circle>
<path d="M0 88 C120 70 260 104 420 84 S720 62 860 86 S980 96 1000 90 V130 H0Z" fill="#4B3FB0"></path>
<path d="M0 108 C160 96 300 118 500 104 S820 94 1000 110 V130 H0Z" fill="#342A86"></path>
<ellipse cx="640" cy="66" rx="11" ry="9" fill="#120F2E"></ellipse><circle cx="650" cy="53" r="6.5" fill="#120F2E"></circle>
</svg>
</div>
</sc-for>
</div>
<div style="padding: 12px 14px; border-radius: 14px; background: #F6F5F8; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; color: #6B6B73">등급별 확률</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 12px">
<sc-for list="{{grades}}" as="g" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 5px; font-size: 13px"><div style="width: 10px; height: 10px; border-radius: 3px; background: {{g.c}}"></div>{{g.n}} {{g.p}}</div>
</sc-for>
</div>
</div>
<div style="flex-grow: 1"></div>
<div style="font-size: 12px; color: #6B6B73; text-align: center">10회 뽑기는 마지막 장 Rare 이상 확정</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-bottom: 20px">
<a href="Draw.dc.html" style="height: 54px; border-radius: 14px; border: 1px solid #DDDBE2; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">1회 · 3,000원</a>
<a href="Draw10.dc.html" style="height: 54px; border-radius: 14px; background: #141414; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">10회 · 30,000원</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var line = { C: ['#C9C8CF', 1], U: ['#5FA36A', 2], R: ['#3E7BD6', 2], E: ['#8A4FD1', 3], L: ['#D98A1E', 3] };
var g = ['C', 'C', 'C', 'U', 'C', 'U', 'R', 'R', 'E', 'L'];
var cards = g.map(function (k, i) { return { vb: (i * 100) + ' 0 100 130', line: line[k][0], bw: line[k][1] }; });
var grades = [
{ n: 'Common', p: '50%', c: '#C9C8CF' }, { n: 'Uncommon', p: '25%', c: '#5FA36A' }, { n: 'Rare', p: '15%', c: '#3E7BD6' },
{ n: 'Epic', p: '8%', c: '#8A4FD1' }, { n: 'Legendary', p: '2%', c: '#D98A1E' }
];
return { cards: cards, grades: grades };
}
}
</script>
</body>
</html>

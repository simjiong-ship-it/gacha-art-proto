<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시리즈 상세</title>
<script src="./support.js"></script>
<script src="./catalog.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:#ffffff;color:#141414}
a{color:#141414;text-decoration:none}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-family: 'IBM Plex Sans KR', sans-serif; color: #141414">
<header style="height: 56px; padding: 0 8px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
<a href="Explore.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
</a>
<div style="font-size: 17px; font-weight: 600">{{s.title}} 시리즈</div>
</header>
<div style="flex-grow: 1; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="height: 190px; border-radius: 16px; overflow: hidden; flex-shrink: 0; position: relative">
<dc-import name="Art" sid="{{s.id}}" vb="470 0 325 130" hint-size="100%,190px"></dc-import>
<sc-if value="{{s.tag}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 10px; top: 10px; height: 24px; padding: 0 10px; border-radius: 12px; background: #ffffff; font-size: 12px; font-weight: 600; display: flex; align-items: center">{{s.tag}}</div></sc-if>
</div>
<a href="{{artistHref}}" style="display: flex; align-items: center; gap: 10px">
<div style="width: 36px; height: 36px; border-radius: 50%; background: {{a.av}}"></div>
<div style="flex-grow: 1">
<div style="font-size: 15px; font-weight: 600">{{s.artist}}</div>
<div style="font-size: 12px; color: #6B6B73">{{a.name}} · 팔로워 {{a.followers}}</div>
</div>
<div style="font-size: 12px; color: #6B6B73">마감 {{s.due}}</div>
</a>
<div style="font-size: 13px; color: #6B6B73">포함된 그림 10장 · 모으면 한 폭의 그림 · 지금까지 뽑기 {{s.pullsText}}회</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="10">
<div style="height: 76px; border-radius: 8px; overflow: hidden; box-sizing: border-box; border: {{c.bw}}px solid {{c.line}}">
<dc-import name="Art" sid="{{c.sid}}" vb="{{c.vb}}" hint-size="100%,100%"></dc-import>
</div>
</sc-for>
</div>
<div style="padding: 12px 14px; border-radius: 14px; background: #F6F5F8; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; color: #6B6B73">등급별 확률</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 12px">
<sc-for list="{{grades}}" as="g" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 5px; font-size: 13px"><div style="width: 10px; height: 10px; border-radius: 3px; background: {{g.c}}"></div>{{g.n}} {{g.p}}</div>
</sc-for>
</div>
</div>
<sc-if value="{{hasOthers}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; color: #6B6B73">{{s.artist}}님의 다른 시리즈</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{others}}" as="o" hint-placeholder-count="1">
<a href="{{o.href}}" style="width: 120px; display: flex; flex-direction: column; gap: 4px">
<div style="height: 80px; border-radius: 10px; overflow: hidden"><dc-import name="Art" sid="{{o.id}}" vb="560 0 160 130" hint-size="100%,80px"></dc-import></div>
<div style="font-size: 12px; font-weight: 600">{{o.title}}</div>
</a>
</sc-for>
</div>
</div>
</sc-if>
<div style="flex-grow: 1"></div>
<div style="font-size: 12px; color: #6B6B73; text-align: center">10회 뽑기는 마지막 장 Rare 이상 확정</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-bottom: 20px">
<a href="{{draw1}}" style="height: 54px; border-radius: 14px; border: 1px solid #DDDBE2; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">1회 · {{s.priceText}}</a>
<a href="{{draw10}}" style="height: 54px; border-radius: 14px; background: #141414; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">10회 · {{tenText}}</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var G = window.GACHA;
var s = G ? G.current() : { id: 'night', title: '밤의 고양이', artist: 'moonlit_draws', priceText: '3,000원', price: 3000, due: 'D-7', pullsText: '1,208', tag: '' };
var a = G ? G.artist(s.artist) : { name: '달빛 그리는 사람', av: '#B3AEEA', followers: '2,410' };
var line = { C: ['#C9C8CF', 1], U: ['#5FA36A', 2], R: ['#3E7BD6', 2], E: ['#8A4FD1', 3], L: ['#D98A1E', 3] };
var g = ['C', 'C', 'C', 'U', 'C', 'U', 'R', 'R', 'E', 'L'];
var cards = g.map(function (k, i) { return { sid: s.id, vb: (i * 100) + ' 0 100 130', line: line[k][0], bw: line[k][1] }; });
var grades = [
{ n: 'Common', p: '50%', c: '#C9C8CF' }, { n: 'Uncommon', p: '25%', c: '#5FA36A' }, { n: 'Rare', p: '15%', c: '#3E7BD6' },
{ n: 'Epic', p: '8%', c: '#8A4FD1' }, { n: 'Legendary', p: '2%', c: '#D98A1E' }
];
var others = G ? G.byArtist(s.artist).filter(function (o) { return o.id !== s.id; }).map(function (o) { return { id: o.id, title: o.title, href: 'Detail.dc.html?s=' + o.id }; }) : [];
return {
s: s, a: a, cards: cards, grades: grades, others: others, hasOthers: others.length > 0,
tenText: (s.price * 10).toLocaleString() + '원',
artistHref: 'SellerPage.dc.html?a=' + encodeURIComponent(s.artist),
draw1: 'Draw.dc.html?s=' + s.id, draw10: 'Draw10.dc.html?s=' + s.id
};
}
}
</script>
</body>
</html>
